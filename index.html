
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minimarket Brutal</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div class="container">

        <h1>
            <marquee>SELAMAT DATANG DI MINIMARKET BRUTAL</marquee>
        </h1>

        <!-- Daftar Produk -->
        <div id="product-list">
            <center>
                <h2>DAFTAR PRODUK</h2>
            </center>

            <!-- ID harus sama dengan JavaScript -->
            <div id="products" class="product-container"></div>
        </div>

        <!-- Keranjang Belanja -->
        <div id="cart">
            <h2>Keranjang Belanja</h2>

            <ul id="cart-items"></ul>

            <p>
                Total: Rp <span id="total-price">0</span>
            </p>

            <button id="checkout-btn">Checkout</button>
        </div>

    </div>
</body>
</html>
